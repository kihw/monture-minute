name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:electron
      - run: npm run lint
      - run: npm test
      - run: npm run build:android
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/site"
          cp -R ../dist-android/. "$RUNNER_TEMP/site/"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/site/monture-minute.apk"
      - name: Prepare Pages site
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp site/index.html "$RUNNER_TEMP/site/index.html"
          cp assets/monture-minute-logo.png "$RUNNER_TEMP/site/monture-minute-logo.png"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/app-release.apk --title "$GITHUB_REF_NAME" --generate-notes

  build-windows:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (capture output)
        id: build
        shell: bash
        run: |
          set +e
          npm run build > "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/build.log"
          exit 0
      - name: Publish build log to release notes on failure
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo ""
            echo "---"
            echo "### build-windows failure log (run $GITHUB_RUN_ID)"
            echo '```'
            tail -n 200 "$RUNNER_TEMP/build.log"
            echo '```'
          } > "$RUNNER_TEMP/notes-append.md"
          gh release view "$GITHUB_REF_NAME" --json body -q .body > "$RUNNER_TEMP/notes-current.md" 2>/dev/null || true
          cat "$RUNNER_TEMP/notes-current.md" "$RUNNER_TEMP/notes-append.md" > "$RUNNER_TEMP/notes-final.md" 2>/dev/null || cp "$RUNNER_TEMP/notes-append.md" "$RUNNER_TEMP/notes-final.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes-final.md"
      - name: Attach Windows build to release
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber
      - name: Fail job if build failed
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: exit 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
