# Release, déclenchée par un tag vX.Y.Z (voir docs/RELEASE.md) : vérifications → installateur
# Windows → contrôle du certificat → manifeste maj.json → publication. L'APK Android est
# normalement compilé et signé en local par `npm run publier`, qui crée la release en brouillon
# avec l'APK : il n'est alors pas recompilé ici. Si la release n'a pas d'APK (tag poussé à la
# main), il est compilé ici en repli (~30 min). La release n'est publiée qu'une fois complète.
# Un tag avec suffixe (v3.1.0-rc.1) donne une préversion, ignorée par les apps installées.
# Lancé à la main (workflow_dispatch), il compile seulement (Windows et un APK de contrôle),
# sans rien publier ; sans clé de signature, l'APK de test est signé avec la clé de débogage.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Le tag correspond à la version de package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $VERSION" >&2
            exit 1
          fi
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: npm test -- --ci

  apk-local:
    name: APK déjà publié ?
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.verif.outputs.present }}
    steps:
      # `npm run publier` crée la release juste après avoir poussé le tag : on lui laisse une minute.
      - id: verif
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.assets[].name' 2>/dev/null | grep -qx 'MontureMinute-Android.apk'; then
              echo "APK compilé en local déjà dans la release : pas de compilation ici."
              echo "present=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Pas d'APK dans la release : compilation de repli sur GitHub."
          echo "present=false" >> "$GITHUB_OUTPUT"

  android:
    name: APK Android
    # Lancement manuel (contrôle), ou tag sans APK compilé en local (repli).
    needs: [verifier, apk-local]
    if: ${{ always() && needs.verifier.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.apk-local.outputs.present == 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Cache Gradle (dépendances, résultats de compilation) d'une release à l'autre.
      - uses: gradle/actions/setup-gradle@v5
        with:
          # Les compilations partent d'un tag, pas de main : sans ça, le cache ne serait jamais enregistré.
          cache-read-only: false
      - name: Clé de signature
        id: cle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "signe=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 absent (clé de signature de Monture Minute, voir docs/RELEASE.md)" >&2
            exit 1
          else
            echo "::warning::Pas de clé de signature : APK de test signé avec la clé de débogage."
            echo "signe=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - if: steps.cle.outputs.signe == 'true'
        run: node scripts/signer-android.mjs
      - name: Compilation de l'APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # 64 bits seulement (tous les téléphones récents), comme l'APK compilé en local : C++ compilé une
        # seule fois et APK plus léger.
        # Mémoire, cache de build et lint : réglés par plugins/compilation-android.js.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - run: cp android/app/build/outputs/apk/release/app-release.apk MontureMinute-Android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: MontureMinute-Android.apk

  windows:
    name: Installateur Windows
    needs: verifier
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
      - run: node scripts/preparer-bureau.mjs
      - name: Installateur NSIS
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            desktop/release/MontureMinute-Setup.exe
            desktop/release/MontureMinute-Setup.exe.blockmap
            desktop/release/latest.yml

  publier:
    name: Release GitHub
    needs: [apk-local, windows, android]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.android.result) }}
    runs-on: ubuntu-latest
    # La release reste en brouillon tant qu'elle n'est pas complète : les apps ne voient une version
    # (« latest ») qu'une fois ses 5 fichiers présents (docs/PLAN-MAJ.md, § 6.4).
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          path: fichiers
          merge-multiple: true
      - name: Release en brouillon
        run: |
          # Créée par `npm run publier` avec l'APK compilé en local, ou ici en repli.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            f="docs/notes/$TAG.md"
            if [ -f "$f" ]; then notes=(--notes-file "$f"); else notes=(--generate-notes); fi
            if [[ "$TAG" == *-* ]]; then pre=(--prerelease); else pre=(); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Monture Minute $TAG" "${notes[@]}" "${pre[@]}"
          fi
          # APK compilé en local : déjà dans la release, récupéré pour le contrôler et l'empreinte.
          if [ ! -f fichiers/MontureMinute-Android.apk ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern MontureMinute-Android.apk --dir fichiers
            echo "APK_LOCAL=true" >> "$GITHUB_ENV"
          fi
      - name: Certificat de signature
        run: |
          # Le même que l'app publiée, sinon Android refuserait la mise à jour sur tous les téléphones.
          outils=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          certificat=$("$outils/apksigner" verify --print-certs fichiers/MontureMinute-Android.apk \
            | sed -n 's/.*SHA-256 digest: *//p' | head -1 | tr 'A-F' 'a-f')
          attendu=$(tr -d '[:space:]' < scripts/signature-android.sha256)
          if [ "$certificat" != "$attendu" ]; then
            echo "::error::Certificat de l'APK ($certificat) différent de celui de l'app publiée ($attendu)"
            exit 1
          fi
          echo "CERTIFICAT=$certificat" >> "$GITHUB_ENV"
      - name: Manifeste maj.json
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          node scripts/manifeste-maj.mjs "$TAG" fichiers notes.md "$CERTIFICAT" > fichiers/maj.json
          cat fichiers/maj.json
      - name: Envoi des fichiers
        run: |
          envoi=(fichiers/MontureMinute-Setup.exe fichiers/MontureMinute-Setup.exe.blockmap fichiers/latest.yml fichiers/maj.json)
          if [ "$APK_LOCAL" != "true" ]; then envoi+=(fichiers/MontureMinute-Android.apk); fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${envoi[@]}"
      - name: Contrôle et publication
        run: |
          presents=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for f in MontureMinute-Android.apk MontureMinute-Setup.exe MontureMinute-Setup.exe.blockmap latest.yml maj.json; do
            if ! grep -qx "$f" <<< "$presents"; then
              echo "::error::$f absent de la release : elle reste en brouillon"
              exit 1
            fi
          done
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
      - name: Manifeste servi à l'adresse fixe
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          sleep 10
          servie=$(curl -sfL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/maj.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          if [ "v$servie" != "$TAG" ]; then
            echo "::error::releases/latest/download/maj.json annonce $servie au lieu de $TAG"
            exit 1
          fi
          echo "maj.json $servie servi à l'adresse fixe."
