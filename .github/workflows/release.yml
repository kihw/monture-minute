# Release, déclenchée par un tag vX.Y.Z (voir docs/RELEASE.md) : vérifications → installateur
# Windows → ajout à la release GitHub. L'APK Android est normalement compilé et signé en local
# par `npm run publier`, qui crée la release avec l'APK : il n'est alors pas recompilé ici. Si la
# release n'a pas d'APK (tag poussé à la main), il est compilé ici en repli (~30 min).
# Lancé à la main (workflow_dispatch), il compile seulement (Windows et un APK de contrôle),
# sans rien publier ; sans clé de signature, l'APK de test est signé avec la clé de débogage.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Le tag correspond à la version de package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $VERSION" >&2
            exit 1
          fi
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: npm test -- --ci

  apk-local:
    name: APK déjà publié ?
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.verif.outputs.present }}
    steps:
      # `npm run publier` crée la release juste après avoir poussé le tag : on lui laisse une minute.
      - id: verif
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.assets[].name' 2>/dev/null | grep -qx 'MontureMinute-Android.apk'; then
              echo "APK compilé en local déjà dans la release : pas de compilation ici."
              echo "present=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Pas d'APK dans la release : compilation de repli sur GitHub."
          echo "present=false" >> "$GITHUB_OUTPUT"

  android:
    name: APK Android
    # Lancement manuel (contrôle), ou tag sans APK compilé en local (repli).
    needs: [verifier, apk-local]
    if: ${{ always() && needs.verifier.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.apk-local.outputs.present == 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Cache Gradle (dépendances, résultats de compilation) d'une release à l'autre.
      - uses: gradle/actions/setup-gradle@v4
      - name: Clé de signature
        id: cle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "signe=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 absent (clé de signature de Monture Minute, voir docs/RELEASE.md)" >&2
            exit 1
          else
            echo "::warning::Pas de clé de signature : APK de test signé avec la clé de débogage."
            echo "signe=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - if: steps.cle.outputs.signe == 'true'
        run: node scripts/signer-android.mjs
      - name: Compilation de l'APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Deux architectures (quasiment tous les téléphones), comme l'APK compilé en local : deux fois moins long.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: cp android/app/build/outputs/apk/release/app-release.apk MontureMinute-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MontureMinute-Android.apk

  windows:
    name: Installateur Windows
    needs: verifier
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
      - run: node scripts/preparer-bureau.mjs
      - name: Installateur NSIS
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/release/MontureMinute-Setup.exe
            desktop/release/MontureMinute-Setup.exe.blockmap
            desktop/release/latest.yml

  publier:
    name: Release GitHub
    needs: [apk-local, windows, android]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.android.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Release créée ici (repli) : ses notes viennent de docs/notes/vX.Y.Z.md s'il existe.
      - name: Notes de version
        run: |
          f="docs/notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then cp "$f" notes.md; else : > notes.md; fi
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # La release existe déjà (créée par `npm run publier` avec l'APK et les notes) : on n'y
          # ajoute que les fichiers Windows, sans toucher aux notes. Sinon, elle est créée ici.
          name: Monture Minute ${{ github.ref_name }}
          # Notes reprises seulement si la release est créée ici, pour ne pas écraser celles de `npm run publier`.
          body_path: ${{ needs.apk-local.outputs.present != 'true' && 'notes.md' || '' }}
          generate_release_notes: true
          # L'APK n'est là qu'en cas de compilation de repli.
          fail_on_unmatched_files: false
          files: |
            fichiers/MontureMinute-Android.apk
            fichiers/MontureMinute-Setup.exe
            fichiers/MontureMinute-Setup.exe.blockmap
            fichiers/latest.yml
