<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    a { color: #a855f7; } a:hover { color: #c084fc; }
    .num { font-family: 'Chakra Petch', 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; font-weight: 600; }
    .zone { font-family: 'Chakra Petch', 'Segoe UI', sans-serif; font-size: 9px; font-weight: 700;
            letter-spacing: .16em; text-transform: uppercase; color: #9494b5; }
  </style>
</helmet>

<div style="width: 1200px; height: 800px; background: #14141f; color: #edeef5; display: flex; flex-direction: column; overflow: hidden;">

  <!-- ══ Barre d'application ══ -->
  <div style="flex: 0 0 42px; background: #1b1b2c; border-bottom: 1px solid #34344f; display: flex; align-items: center; justify-content: space-between; padding: 0 14px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
        <path d="M12 2.5 20.5 7.2v9.6L12 21.5 3.5 16.8V7.2z" stroke="#a855f7" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 7.5v9M8 10v4M16 10v4" stroke="#e879f9" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span style="font-size: 13px; font-weight: 700;">Dofus Breeding Tool</span>
    </div>
    <div style="display: flex; background: #15151f; border: 1px solid #34344f; border-radius: 7px; padding: 2px; gap: 2px;">
      <span style="padding: 4px 13px; border-radius: 5px; background: #a855f7; color: #14141f; font-size: 11px; font-weight: 700;">Enclos</span>
      <span style="padding: 4px 13px; border-radius: 5px; color: #a6a6c0; font-size: 11px; font-weight: 600;">Élevage</span>
      <span style="padding: 4px 13px; border-radius: 5px; color: #a6a6c0; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 6px;">
        Minuteurs <span class="num" style="background: #4ade80; color: #14141f; border-radius: 999px; padding: 0 6px; font-size: 10px; line-height: 15px;">4</span>
      </span>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; padding: 13px; display: flex; flex-direction: column; gap: 11px;">

    <!-- ══ Bandeau de synthèse : ce que 6 enclos rendent impossible à voir autrement ══ -->
    <div style="display: flex; gap: 9px; align-items: stretch;">
      <sc-for list="{{summary}}" as="s" hint-placeholder-count="4">
        <div style="{{s.style}}">
          <div class="zone" style="margin-bottom: 5px;">{{s.label}}</div>
          <div style="display: flex; align-items: baseline; gap: 6px;">
            <span class="num" style="font-size: 22px; font-weight: 700; line-height: 1; color: {{s.color}};">{{s.value}}</span>
            <span style="font-size: 11px; color: #9494b5;">{{s.unit}}</span>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- ══ Grille des 6 enclos ══ -->
    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{enclos}}" as="e" hint-placeholder-count="6">
        <div style="{{e.cardStyle}}">

          <!-- En-tête : nom + état -->
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 7px; min-width: 0;">
              <span class="num" style="{{e.numStyle}}">{{e.n}}</span>
              <span style="min-width: 0;">
                <span style="display: block; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{e.name}}</span>
                <span style="display: block; font-size: 10px; color: #9494b5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{e.mount}}</span>
              </span>
            </div>
            <span style="{{e.pillStyle}}">{{e.status}}</span>
          </div>

          <!-- Bandeau des 6 jauges : lecture d'un enclos entier d'un coup d'œil -->
          <div style="display: flex; justify-content: center; gap: 8px;">
            <sc-for list="{{e.gauges}}" as="g" hint-placeholder-count="6">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 40px;">
                <div style="{{g.barStyle}}">
                  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{g.fill}}; background: {{g.fillColor}};"></div>
                  <div style="position: absolute; left: 0; right: 0; bottom: 40%; height: 1px; background: rgba(255,255,255,.13);"></div>
                  <div style="position: absolute; left: 0; right: 0; bottom: 70%; height: 1px; background: rgba(255,255,255,.13);"></div>
                  <div style="position: absolute; left: 0; right: 0; bottom: 90%; height: 1px; background: rgba(255,255,255,.13);"></div>
                </div>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="{{g.icon}}" stroke="{{g.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="num" style="font-size: 9px; color: {{g.iconColor}}; line-height: 1;">{{g.tier}}</span>
              </div>
            </sc-for>
          </div>

          <!-- Action en cours + compte à rebours -->
          <div style="{{e.footStyle}}">
            <div style="min-width: 0;">
              <div class="zone" style="margin-bottom: 3px;">{{e.actionLabel}}</div>
              <div style="font-size: 11px; font-weight: 600; color: {{e.actionColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{e.action}}</div>
            </div>
            <div style="text-align: right; flex-shrink: 0;">
              <div class="num" style="font-size: 19px; font-weight: 700; line-height: 1; color: {{e.timeColor}};">{{e.time}}</div>
              <div class="num" style="font-size: 9px; color: #9494b5; margin-top: 2px;">{{e.endAt}}</div>
            </div>
          </div>

          <!-- Alerte carburant, seulement quand elle existe -->
          <sc-if value="{{e.hasAlert}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: #fbbf2414; border: 1px solid #fbbf2444; border-radius: 6px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 4.5 21 19.5H3z" stroke="#fbbf24" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4M12 16.6v.2" stroke="#fbbf24" stroke-width="1.9" stroke-linecap="round"/></svg>
              <span style="font-size: 10px; color: #fbbf24;">{{e.alert}}</span>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1200,"height":800},"accent":{"editor":"color","default":"#a855f7","options":["#a855f7","#38bdf8","#fb7185","#4ade80"]}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#a855f7';

    const ICONS = {
      baffeur: 'M5 12h14',
      caresseur: 'M12 5v14M5 12h14',
      foudroyeur: 'M13 2.5 5 13.5h6l-1 8 8-11h-6z',
      abreuvoir: 'M12 3.4c3.3 3.9 5.4 6.5 5.4 9.1a5.4 5.4 0 0 1-10.8 0c0-2.6 2.1-5.2 5.4-9.1z',
      dragofesse: 'M12 20.4 4.9 13.3a4.3 4.3 0 0 1 6.1-6.1l1 1 1-1a4.3 4.3 0 0 1 6.1 6.1z',
      mangeoire: 'm12 3.6 2.6 5.5 6 .9-4.3 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.4 10l6-.9z',
    };
    const COLORS = {
      baffeur: '#a855f7', caresseur: '#e879f9', foudroyeur: '#f5c518',
      abreuvoir: '#38bdf8', dragofesse: '#fb7185', mangeoire: '#ff8c42',
    };
    const KEYS = ['baffeur', 'caresseur', 'foudroyeur', 'abreuvoir', 'dragofesse', 'mangeoire'];

    const tierOf = v => (v > 90000 ? 4 : v > 70000 ? 3 : v > 40000 ? 2 : 1);

    // Une jauge active se lit à sa couleur pleine + son anneau ; une inactive reste sourde.
    const gauge = (key, value, active) => {
      const c = COLORS[key];
      return {
        icon: ICONS[key],
        fill: Math.round((value / 100000) * 100) + '%',
        tier: 'T' + tierOf(value),
        fillColor: active ? c : c + '4d',
        iconColor: active ? c : '#6f6f8c',
        barStyle:
          'position:relative;width:30px;height:74px;background:#101019;border-radius:5px;overflow:hidden;' +
          (active ? 'border:1.5px solid ' + c + ';box-shadow:0 0 0 2px ' + c + '22;' : 'border:1px solid #34344f;'),
      };
    };

    const pill = (bg, bd, fg) =>
      'font-size:9px;font-weight:700;letter-spacing:.05em;border-radius:999px;padding:2px 8px;flex-shrink:0;' +
      "font-family:'Chakra Petch',sans-serif;background:" + bg + ';border:1px solid ' + bd + ';color:' + fg + ';';

    const card = (highlight, dim) =>
      'background:#232336;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;' +
      (highlight
        ? 'border:1px solid ' + accent + ';box-shadow:0 0 0 3px ' + accent + '1f;'
        : 'border:1px solid #34344f;') +
      (dim ? 'opacity:.62;' : '');

    const numChip = (on) =>
      'width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;' +
      'font-size:11px;font-weight:700;' +
      (on ? 'background:' + accent + ';color:#14141f;' : 'background:#1a1a29;color:#9494b5;border:1px solid #34344f;');

    const foot =
      'display:flex;align-items:flex-end;justify-content:space-between;gap:9px;' +
      'background:#15151f;border:1px solid #34344f;border-radius:8px;padding:8px 10px;margin-top:auto;';

    const mk = (o) => ({
      n: o.n, name: o.name, mount: o.mount, status: o.status,
      pillStyle: o.pill, cardStyle: card(o.next, o.dim), numStyle: numChip(o.next), footStyle: foot,
      gauges: KEYS.map(k => gauge(k, o.values[k], (o.active || []).indexOf(k) >= 0)),
      actionLabel: o.actionLabel, action: o.action, actionColor: o.actionColor || '#edeef5',
      time: o.time, endAt: o.endAt, timeColor: o.timeColor || '#edeef5',
      hasAlert: !!o.alert, alert: o.alert || '',
    });

    const full = { baffeur: 86500, caresseur: 50000, foudroyeur: 50000, abreuvoir: 50000, dragofesse: 50000, mangeoire: 62000 };

    return {
      accent,
      summary: [
        { label: 'Enclos en activité', value: '4', unit: '/ 6', color: '#edeef5',
          style: 'flex:1;background:#232336;border:1px solid #34344f;border-radius:9px;padding:10px 13px;' },
        { label: 'Jauges actives', value: '7', unit: '/ 12 (2 par enclos)', color: '#edeef5',
          style: 'flex:1;background:#232336;border:1px solid #34344f;border-radius:9px;padding:10px 13px;' },
        { label: 'Prochaine échéance', value: '06:21', unit: 'Enclos 1', color: accent,
          style: 'flex:1;background:#232336;border:1px solid ' + accent + '66;border-radius:9px;padding:10px 13px;' },
        { label: 'Alertes carburant', value: '1', unit: 'Enclos 3', color: '#fbbf24',
          style: 'flex:1;background:#232336;border:1px solid #fbbf2455;border-radius:9px;padding:10px 13px;' },
      ],
      enclos: [
        mk({
          n: '1', name: 'Astrub — principal', mount: 'Pourpre #1 · Amoureuse',
          status: 'EN COURS', pill: pill('#4ade8018', '#4ade8055', '#4ade80'), next: true,
          values: full, active: ['baffeur', 'mangeoire'],
          actionLabel: 'Sérénité +4 320 → +1 000', action: 'Baffeur + Mangeoire', actionColor: '#a855f7',
          time: '06:21', endAt: 'fin 16:06',
        }),
        mk({
          n: '2', name: 'Bonta — sud', mount: 'Émeraude #2 · Précoce',
          status: 'EN COURS', pill: pill('#4ade8018', '#4ade8055', '#4ade80'),
          values: { baffeur: 30000, caresseur: 44000, foudroyeur: 22000, abreuvoir: 78000, dragofesse: 91000, mangeoire: 15000 },
          active: ['dragofesse', 'abreuvoir'],
          actionLabel: 'Amour 8 200 → 20 000', action: 'Dragofesse + Abreuvoir', actionColor: '#fb7185',
          time: '24:58', endAt: 'fin 16:25',
        }),
        mk({
          n: '3', name: 'Amakna — ferme', mount: 'Amande #3 · Sage',
          status: 'CARBURANT BAS', pill: pill('#fbbf2418', '#fbbf2455', '#fbbf24'),
          values: { baffeur: 12000, caresseur: 8000, foudroyeur: 5000, abreuvoir: 9000, dragofesse: 4000, mangeoire: 4800 },
          active: ['mangeoire'],
          actionLabel: 'Niveau 84 → 100', action: 'Mangeoire', actionColor: '#ff8c42',
          time: '04:00', endAt: 'épuisement', timeColor: '#fbbf24',
          alert: 'Mangeoire épuisée dans 4 min — objectif non atteint',
        }),
        mk({
          n: '4', name: 'Sufokia — enclos loué', mount: 'Indigo #4 · Endurante',
          status: 'INACTIF', pill: pill('#15151f', '#34344f', '#9494b5'), dim: true,
          values: { baffeur: 66000, caresseur: 71000, foudroyeur: 88000, abreuvoir: 54000, dragofesse: 33000, mangeoire: 47000 },
          active: [],
          actionLabel: 'Aucune jauge active', action: 'Prêt — Endurance 0 / 20 000', actionColor: '#9494b5',
          time: '—', endAt: '', timeColor: '#6f6f8c',
        }),
        mk({
          n: '5', name: 'Pandala — haut', mount: 'Safran #5 · Amoureuse',
          status: 'EN COURS', pill: pill('#4ade8018', '#4ade8055', '#4ade80'),
          values: { baffeur: 41000, caresseur: 60000, foudroyeur: 95000, abreuvoir: 83000, dragofesse: 28000, mangeoire: 37000 },
          active: ['foudroyeur', 'abreuvoir'],
          actionLabel: 'Endurance + Maturité → 20 000', action: 'Foudroyeur + Abreuvoir', actionColor: '#f5c518',
          time: '1:02:14', endAt: 'fin 17:04',
        }),
        mk({
          n: '6', name: 'Enclos libre', mount: 'Aucune monture',
          status: 'VIDE', pill: pill('#15151f', '#34344f', '#6f6f8c'), dim: true,
          values: { baffeur: 0, caresseur: 0, foudroyeur: 0, abreuvoir: 0, dragofesse: 0, mangeoire: 0 },
          active: [],
          actionLabel: 'Enclos disponible', action: 'Placer une monture', actionColor: '#6f6f8c',
          time: '—', endAt: '', timeColor: '#6f6f8c',
        }),
      ],
    };
  }
}
</script>
</body>
</html>
