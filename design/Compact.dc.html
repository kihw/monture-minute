<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    a { color: #a855f7; } a:hover { color: #c084fc; }
    .num { font-family: 'Chakra Petch', 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; font-weight: 600; }
    .zone { font-family: 'Chakra Petch', 'Segoe UI', sans-serif; font-size: 9px; font-weight: 700;
            letter-spacing: .16em; text-transform: uppercase; color: #9494b5; }
  </style>
</helmet>

<div style="width: 380px; height: 520px; background: #14141f; color: #edeef5; display: flex; flex-direction: column; border: 1px solid #45456a; border-radius: 10px; overflow: hidden;">

  <!-- Chrome de fenêtre : c'est une vraie fenêtre Windows toujours au-dessus -->
  <div style="flex: 0 0 32px; background: #1b1b2c; border-bottom: 1px solid #34344f; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 10px;">
    <div style="display: flex; align-items: center; gap: 7px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M12 2.5 20.5 7.2v9.6L12 21.5 3.5 16.8V7.2z" stroke="#a855f7" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span style="font-size: 11px; font-weight: 700;">Mode compact</span>
    </div>
    <div style="display: flex; align-items: center; gap: 2px;">
      <span style="width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center; background: #a855f7;" title="Toujours au-dessus">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 4h6l-1 6 4 3v2h-5.5v5l-1 1-1-1v-5H5v-2l4-3z" stroke="#14141f" stroke-width="1.9" stroke-linejoin="round"/></svg>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center;" title="Agrandir">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M14 5h5v5M10 19H5v-5M19 5l-6.5 6.5M5 19l6.5-6.5" stroke="#a6a6c0" stroke-width="1.9" stroke-linecap="round"/></svg>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center;" title="Fermer">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="#a6a6c0" stroke-width="1.9" stroke-linecap="round"/></svg>
      </span>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 11px;">

    <!-- Enclos + monture : avec 6 enclos, savoir lequel est affiché est vital -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 7px; min-width: 0;">
        <span class="num" style="width: 22px; height: 22px; border-radius: 6px; background: #a855f7; color: #14141f; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;">1</span>
        <span style="min-width: 0;">
          <span style="display: block; font-size: 13px; font-weight: 700; line-height: 1.2;">Pourpre #1</span>
          <span style="display: block; font-size: 10px; color: #9494b5;">Astrub — principal</span>
        </span>
      </div>
      <span class="num" style="font-size: 9px; background: #4ade8018; border: 1px solid #4ade8055; color: #4ade80; border-radius: 999px; padding: 2px 8px; flex-shrink: 0;">EN COURS</span>
    </div>

    <!-- Navigation entre enclos sans quitter le mode compact -->
    <div style="display: flex; gap: 4px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <span class="num" style="{{t.style}}">{{t.n}}</span>
      </sc-for>
    </div>

    <!-- Le compte à rebours domine : c'est la raison d'être de cette fenêtre -->
    <div style="background: #1b1b2c; border: 1px solid #34344f; border-radius: 10px; padding: 15px; text-align: center;">
      <div class="zone" style="margin-bottom: 6px;">Temps restant</div>
      <div class="num" style="font-size: 52px; font-weight: 700; line-height: 1;">06<span style="color: #a6a6c0;">:</span>21</div>
      <div style="position: relative; height: 5px; background: #101019; border-radius: 999px; overflow: hidden; margin-top: 13px;">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 66%; background: linear-gradient(90deg, #a855f7, #e879f9); border-radius: 999px;"></span>
      </div>
      <div class="num" style="font-size: 10px; color: #9494b5; margin-top: 7px;">fin à 16:06:50</div>
    </div>

    <!-- Objectif en cours -->
    <div style="background: #1a1a29; border: 1px solid #34344f; border-radius: 9px; padding: 10px 12px;">
      <div class="zone" style="margin-bottom: 6px;">Objectif</div>
      <div class="num" style="font-size: 15px;">
        <span style="color: #a855f7;">+4 320</span>
        <span style="color: #9494b5;"> → </span>
        <span style="color: #4ade80;">+1 000</span>
        <span style="font-size: 11px; color: #9494b5; font-family: 'Segoe UI', sans-serif; font-weight: 400;"> Sérénité</span>
      </div>
    </div>

    <!-- Jauges actives seulement : deux au maximum, donc rien à filtrer -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="zone">Jauges actives</div>
      <sc-for list="{{active}}" as="g" hint-placeholder-count="2">
        <div style="display: grid; grid-template-columns: 84px 1fr 62px; align-items: center; gap: 9px;">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: {{g.color}};"></span>{{g.name}}
          </span>
          <span style="position: relative; height: 7px; background: #101019; border: 1px solid #34344f; border-radius: 999px; overflow: hidden;">
            <span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{g.fill}}; background: {{g.color}}; border-radius: 999px;"></span>
          </span>
          <span class="num" style="font-size: 11px; text-align: right;">
            {{g.value}}<br><span style="font-size: 9px; color: {{g.color}};">{{g.tier}}</span>
          </span>
        </div>
      </sc-for>
    </div>

    <!-- Actions -->
    <div style="margin-top: auto; display: flex; gap: 7px;">
      <span style="flex: 1; background: #fbbf24; color: #14141f; border-radius: 8px; padding: 10px; font-size: 12px; font-weight: 700; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9.5 5.5v13M14.5 5.5v13" stroke="#14141f" stroke-width="2.2" stroke-linecap="round"/></svg>
        Pause
      </span>
      <span style="flex: 1; background: #1a1a29; border: 1px solid #34344f; color: #a6a6c0; border-radius: 8px; padding: 10px; font-size: 12px; font-weight: 600; text-align: center;">Arrêter</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":380,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    // Onglet d'enclos : sélectionné · en activité · vide
    const tab = (n, state) => ({
      n,
      style:
        'flex:1;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;' +
        'font-size:10px;font-weight:700;cursor:pointer;' +
        (state === 'sel'
          ? 'background:#a855f7;color:#14141f;'
          : state === 'run'
            ? 'background:#1a1a29;border:1px solid #4ade8055;color:#4ade80;'
            : 'background:#1a1a29;border:1px solid #34344f;color:#6f6f8c;'),
    });

    return {
      tabs: [tab('1', 'sel'), tab('2', 'run'), tab('3', 'run'), tab('4', 'off'), tab('5', 'run'), tab('6', 'off')],
      active: [
        { name: 'Baffeur', color: '#a855f7', value: '83 170', tier: 'T3 · 30/tick', fill: '83%' },
        { name: 'Mangeoire', color: '#ff8c42', value: '59 780', tier: 'T2 · 20/tick', fill: '60%' },
      ],
    };
  }
}
</script>
</body>
</html>
